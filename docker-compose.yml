services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tyba
      POSTGRES_PASSWORD: tyba
      POSTGRES_DB: movimientos
    ports:
      - "5433:5432"
    volumes:
      - ./data/output:/var/lib/postgresql/data
      - ./sql/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyba -d movimientos"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tyba
      POSTGRES_PASSWORD: tyba
      POSTGRES_DB: movimientos
    volumes:
      - ./data/raw:/app/data/raw:ro
    command: ["sh", "correr_cortes.sh"]
